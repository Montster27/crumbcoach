name: Crumbcoach
options:
  bundleIdPrefix: com.crumbcoach
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Crumbcoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Crumbcoach
    resources:
      - path: Crumbcoach/Resources/Assets.xcassets
    info:
      path: Crumbcoach/Info.plist
      properties:
        CFBundleDisplayName: CrumbCoach
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        # Opt out of iPad multitasking (Split View / Slide Over / Stage
        # Manager). The layout was designed for a single 1440×1024 canvas;
        # supporting arbitrary side-by-side widths is real work. With
        # UIRequiresFullScreen = true, restricting to landscape orientations
        # is allowed.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIDeviceFamily:
          - 2
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: "Photograph your crumb, dough, and starter so CrumbCoach can analyze and log them."
        NSPhotoLibraryUsageDescription: "Attach photos from your library to bakes and diagnostics."
        NSUserNotificationsUsageDescription: "Remind you when each bake step is due — folds, shaping, baking."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crumbcoach.app
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CrumbcoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CrumbcoachTests
    dependencies:
      - target: Crumbcoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crumbcoach.app.tests
        TARGETED_DEVICE_FAMILY: "2"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crumbcoach.app/Crumbcoach"
