name: Crumbcoach
options:
  bundleIdPrefix: com.crumbcoach
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Stage 27 — make sure xcodegen produces a shared scheme named Crumbcoach
  # so `xcodebuild -scheme Crumbcoach` keeps working after re-generation.
  # Without this xcodegen only emits the test scheme and Xcode auto-creates
  # the others, which don't survive `xcodegen generate`.
schemes:
  Crumbcoach:
    build:
      targets:
        Crumbcoach: all
        CrumbcoachWidgets: all
        CrumbcoachShareExtension: all
        CrumbcoachTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - CrumbcoachTests
    run:
      config: Debug
    archive:
      config: Release
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_PREVIEWS: YES
    # Monty's personal-team signing identity. A fork to another team
    # changes this + the four `com.monty.crumbcoach.app[.*]` bundle ids
    # below + the `iCloud.com.monty.crumbcoach.app` container references.
    DEVELOPMENT_TEAM: 9C4LVC9DR6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Crumbcoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Crumbcoach
    resources:
      - path: Crumbcoach/Resources/Assets.xcassets
    dependencies:
      - target: CrumbcoachWidgets
        embed: true
      - target: CrumbcoachShareExtension
        embed: true
    info:
      path: Crumbcoach/Info.plist
      properties:
        CFBundleDisplayName: CrumbCoach
        CFBundleShortVersionString: "0.1.0"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        # Opt out of iPad multitasking (Split View / Slide Over / Stage
        # Manager). The layout was designed for a single 1440×1024 canvas;
        # supporting arbitrary side-by-side widths is real work. With
        # UIRequiresFullScreen = true, restricting to landscape orientations
        # is allowed.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIDeviceFamily:
          - 2
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: "Photograph your crumb, dough, and starter so CrumbCoach can analyze and log them."
        NSPhotoLibraryUsageDescription: "Attach photos from your library to bakes and diagnostics."
        NSUserNotificationsUsageDescription: "Remind you when each bake step is due — folds, shaping, baking."
        # Stage 25 — Sourdough Sidekick scaffolding. CoreBluetooth scan is
        # gated behind the Settings pairing UI; we only request the
        # permission the first time the user taps "Pair".
        NSBluetoothAlwaysUsageDescription: "Connect to a Sourdough Sidekick over Bluetooth to read starter temperature and rise data."
        # Stage 16 — required for `Activity<>.request()` to succeed.
        NSSupportsLiveActivities: true
        # Stage 18 — `crumbcoach://` URL scheme for deep-link sharing and
        # the share-extension hand-off.
        CFBundleURLTypes:
          - CFBundleURLName: com.crumbcoach.app
            CFBundleURLSchemes:
              - crumbcoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monty.crumbcoach.app
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Crumbcoach/Crumbcoach.entitlements
    # Stage 15 — iCloud Drive sync via the ubiquity Documents container.
    # The signing team must enable iCloud (Documents) on the App ID in
    # Apple Developer + provision the matching container. CloudSyncManager
    # gracefully no-ops at runtime if the container isn't reachable (no
    # team / not signed in).
    entitlements:
      path: Crumbcoach/Crumbcoach.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.monty.crumbcoach.app
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.monty.crumbcoach.app
        # Stage 19 — App Group shared between the main app and the widget
        # extension so widgets can read the active-bake snapshot the main
        # app writes on every `activeBake` mutation.
        com.apple.security.application-groups:
          - group.com.monty.crumbcoach.shared
  CrumbcoachWidgets:
    # Stage 16 — Live Activity. Stage 19 — Home Screen + Lock Screen
    # widgets reading from the App Group snapshot. ActiveBakeAttributes
    # and WidgetSnapshot are shared with the main app via the `sources`
    # paths below.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CrumbcoachWidgets
      - path: Crumbcoach/Shared/ActiveBakeAttributes.swift
      - path: Crumbcoach/Shared/WidgetSnapshot.swift
      - path: Crumbcoach/Shared/SharedContainer.swift
    info:
      path: CrumbcoachWidgets/Info.plist
      properties:
        CFBundleDisplayName: CrumbCoach Widgets
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CrumbcoachWidgets/CrumbcoachWidgets.entitlements
      properties:
        # Same App Group as the main app — widgets read the snapshot the
        # main app writes here.
        com.apple.security.application-groups:
          - group.com.monty.crumbcoach.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monty.crumbcoach.app.widgets
        TARGETED_DEVICE_FAMILY: "2"
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        CODE_SIGN_ENTITLEMENTS: CrumbcoachWidgets/CrumbcoachWidgets.entitlements
  CrumbcoachShareExtension:
    # Stage 18 — Safari share → CrumbCoach. Reads the shared URL, encodes
    # it as `crumbcoach://import?url=…`, and opens the main app via the
    # responder-chain `openURL:` hand-off. No persistent UI.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CrumbcoachShareExtension
    info:
      path: CrumbcoachShareExtension/Info.plist
      properties:
        CFBundleDisplayName: CrumbCoach
        CFBundleShortVersionString: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monty.crumbcoach.app.share
        TARGETED_DEVICE_FAMILY: "2"
        SKIP_INSTALL: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
  CrumbcoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CrumbcoachTests
    dependencies:
      - target: Crumbcoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monty.crumbcoach.app.tests
        TARGETED_DEVICE_FAMILY: "2"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crumbcoach.app/Crumbcoach"
        # Without this, xcodebuild test refuses to sign the test bundle.
        # No custom Info.plist is needed for unit tests — Xcode generates
        # one with the right bundle id at build time.
        GENERATE_INFOPLIST_FILE: YES
